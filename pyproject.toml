[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inscribed-polytopes"
version = "0.1.0"
description = "Maximum-volume polytopes inscribed in the unit sphere, in any dimension"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
exact = ["mpmath>=1.3", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
packages = [{ include = "inscribed", from = "src" }]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]
known_first_party = ["inscribed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

# The base declares **params; each family narrows to its own named parameters,
# which is the intended call interface.
[[tool.mypy.overrides]]
module = "inscribed.catalog.families"
disable_error_code = ["override"]

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^2.3.1"
isort = "^9.0.1"
pre-commit = "^4.6.2"
pytest = "^9.1.1"

