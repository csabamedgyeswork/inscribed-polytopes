# Hooks run the tools from the in-project .venv (poetry.toml sets
# virtualenvs.in-project), so versions stay pinned by poetry.lock.
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: .venv/bin/isort
        language: system
        types: [python]
        files: ^src/

      - id: flake8
        name: flake8
        entry: .venv/bin/flake8
        language: system
        types: [python]
        files: ^src/

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
